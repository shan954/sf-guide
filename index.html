<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shan's SF City Guide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #fafaf7;
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e2db;
    --accent: #c8553d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  .app {
    display: grid;
    grid-template-columns: 360px 1fr;
    height: 100vh;
    height: 100dvh; /* dvh keeps iOS Safari's toolbar from cropping the map */
  }
  .sidebar {
    border-right: 1px solid var(--line);
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    padding: 24px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  .header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .header p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .filters {
    display: flex;
    gap: 6px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .chip {
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: all 0.15s ease;
    user-select: none;
  }
  .chip:hover { background: #f5f2ec; }
  .chip.active {
    background: var(--ink);
    color: #fff;
    border-color: var(--ink);
  }
  .list {
    overflow-y: auto;
    flex: 1;
    padding: 8px 0;
  }
  .place {
    padding: 14px 24px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .place:hover { background: #f5f2ec; }
  .place-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .place-name {
    font-weight: 600;
    font-size: 15px;
  }
  .place-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .place-category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .vibe {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: #f0ede5;
    color: #5a5346;
    border: 1px solid var(--line);
    font-style: italic;
  }
  .place-desc {
    font-size: 13px;
    color: #333;
    line-height: 1.5;
  }
  .place-address {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }
  #map {
    height: 100%;
    width: 100%;
  }
  .leaflet-popup-content-wrapper {
    border-radius: 8px;
  }
  .popup-name {
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 4px;
  }
  .popup-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .popup-category {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }
  .popup-desc {
    font-size: 13px;
    line-height: 1.5;
    color: #333;
  }
  .notice {
    padding: 40px 24px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }
  .diag-toggle {
    float: right;
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
  }
  .diag-toggle:hover { color: var(--ink); }
  .diag-panel {
    max-height: 40vh;
    overflow-y: auto;
    padding: 4px 24px 16px;
    border-top: 1px solid var(--line);
    background: #fbfaf7;
  }
  .place.unlocated { opacity: 0.75; cursor: default; }
  .no-pin {
    font-size: 11px;
    color: var(--accent);
    margin-top: 4px;
  }
  .notice strong { color: var(--ink); display: block; margin-bottom: 6px; }
  .diag {
    margin-top: 14px;
    text-align: left;
    border-top: 1px solid var(--line);
  }
  .diag-row {
    display: flex;
    gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
  }
  .diag-label {
    flex: 0 0 96px;
    color: var(--muted);
    font-weight: 600;
  }
  .diag-value {
    flex: 1;
    color: var(--ink);
    word-break: break-word;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    line-height: 1.5;
  }
  .hoodbar {
    padding: 10px 24px;
    border-bottom: 1px solid var(--line);
  }
  .hoodbar select {
    width: 100%;
    font: inherit;
    font-size: 13px;
    color: var(--ink);
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath fill='%236b6b6b' d='M0 0h10L5 6z'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 12px center;
  }
  .group-header {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 24px;
    background: #f7f5f0;
    border-bottom: 1px solid var(--line);
    border-top: 1px solid var(--line);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #5a5346;
    cursor: pointer;
  }
  .group-header:hover { background: #f0ede5; }
  .group-count {
    font-weight: 500;
    letter-spacing: 0;
    color: var(--muted);
  }
  .about-btn {
    float: right;
    margin-left: 12px;
    background: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px 12px;
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .about-btn:hover { background: #f5f2ec; color: var(--ink); }
  .about-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(26, 26, 26, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal {
    position: relative;
    background: #fff;
    border-radius: 14px;
    max-width: 460px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 28px 28px 24px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.24);
    animation: modal-in 0.2s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }
  .modal h2 {
    margin: 0 0 14px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .modal p {
    margin: 0 0 12px;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }
  .modal p:last-child { margin-bottom: 0; }
  .modal a { color: var(--accent); }
  .modal-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    font-size: 26px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 4px 8px;
  }
  .modal-close:hover { color: var(--ink); }

  .grip { display: none; }
  .footer {
    padding: 12px 24px;
    border-top: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
  }
  /* ==========================================================
     PHONE LAYOUT
     Map fills the screen; the list becomes a sheet you drag up
     from the bottom. Three snap positions: peek, half, full.
     ========================================================== */
  @media (max-width: 820px) and (orientation: portrait) {
    .app {
      display: block;
      position: relative;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      height: 100%;
    }
    .sidebar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 92%;
      border-right: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.16);
      z-index: 1000; /* above Leaflet's controls */
      transform: translateY(var(--sheet-y, 62%));
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }
    .sidebar.dragging { transition: none; }
    .sidebar.peek  { --sheet-y: calc(100% - 148px); }
    .sidebar.half  { --sheet-y: 48%; }
    .sidebar.full  { --sheet-y: 0%; }

    .grip {
      display: block;
      padding: 8px 0 4px;
      cursor: grab;
      touch-action: none;
    }
    .grip::before {
      content: "";
      display: block;
      width: 38px;
      height: 4px;
      margin: 0 auto;
      border-radius: 999px;
      background: #d4d0c7;
    }
    .header {
      padding: 4px 20px 12px;
      touch-action: none;
    }
    .header h1 { font-size: 18px; }
    .header p {
      font-size: 12px;
      line-height: 1.4;
      /* Wrap onto a second line, then cut off if it somehow runs longer. */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .filters {
      padding: 12px 20px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filters::-webkit-scrollbar { display: none; }
    .hoodbar { padding: 8px 20px; }
    .modal { padding: 24px 20px 20px; max-height: 76vh; }
    .modal-backdrop { padding: 16px; align-items: flex-end; }
    .hoodbar select { padding: 8px 10px; font-size: 14px; }
    .group-header { padding: 7px 20px; }
    .chip {
      flex: 0 0 auto;
      font-size: 13px;
      padding: 8px 14px;
    }
    .place { padding: 14px 20px; }
    .place-name { font-size: 16px; }
    .place-desc { font-size: 14px; }
    .list {
      /* room for the home indicator on newer iPhones */
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
    }
    .footer { padding: 10px 20px calc(10px + env(safe-area-inset-bottom)); }
    .leaflet-popup-content { margin: 12px 14px; }
  }

  /* ==========================================================
     SHORT SCREENS (phone held sideways)
     A phone in landscape is wide but only ~390px tall, so the
     match is on height, not width. Every bit of chrome shrinks
     to leave the list some room to breathe.
     ========================================================== */
  @media (orientation: landscape) and (max-height: 560px) {
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      overflow: visible;
    }
    #map { position: static; }
    .sidebar {
      position: static;
      height: 100%;
      transform: none;
      border-radius: 0;
      border-right: 1px solid var(--line);
      box-shadow: none;
    }
    .grip { display: none; }

    /* Title only. The tagline costs a line we can't spare here. */
    .header {
      padding: 9px 14px 7px;
      touch-action: auto;
    }
    .header h1 { font-size: 15px; }
    .header p { display: none; }

    .filters {
      padding: 7px 14px;
      gap: 5px;
      flex-wrap: nowrap;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; font-size: 12px; padding: 5px 11px; }
    .hoodbar { padding: 6px 14px; }
    .hoodbar select { padding: 5px 9px; font-size: 12px; }
    .group-header { padding: 5px 14px; font-size: 10px; }

    /* Denser rows: two lines of description, no address line. */
    .place { padding: 9px 14px; }
    .place-header { margin-bottom: 2px; }
    .place-name { font-size: 14px; }
    .place-meta { margin-bottom: 3px; }
    .place-desc {
      font-size: 12px;
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .place-address { display: none; }

    .footer { padding: 6px 14px; font-size: 10px; }
    .diag-panel { max-height: 50%; padding: 4px 14px 12px; }
  }

  /* The grip only exists on phones in portrait */

  @media (prefers-reduced-motion: reduce) {
    .sidebar, .chip, .place { transition: none; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar half" id="sidebar">
    <div class="grip" id="grip" aria-hidden="true"></div>
    <div class="header" id="sheet-header">
      <button class="about-btn" id="about-btn" aria-haspopup="dialog">About</button>
      <h1>Shan's SF City Guide</h1>
      <p>A curated local guide to places in SF the latest YC transplants won't know about</p>
    </div>
    <div class="filters" id="filters"></div>
    <div class="hoodbar" hidden>
      <select id="nb-select" aria-label="Filter by neighborhood"></select>
    </div>
    <div class="list" id="list"></div>
    <div class="footer">
      Places: <span id="source-label">loading…</span>
      <button class="diag-toggle" id="diag-toggle">Show load details</button>
    </div>
    <div class="diag-panel" id="diag-panel" hidden></div>
  </aside>
  <div id="map"></div>
</div>

<div class="modal-backdrop" id="about-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="about-title">
    <button class="modal-close" id="about-close" aria-label="Close">&times;</button>
    <h2 id="about-title"></h2>
    <div id="about-body"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script>
  // ============================================================
  // 1. YOUR GOOGLE SHEET
  // ============================================================
  // Paste your published CSV link between the quotes below.
  // (File > Share > Publish to web > pick the sheet > CSV > Publish)
  //
  // Leave it empty to use the FALLBACK_PLACES list further down.
  //
  // Sheet columns (row 1 must be these headers, any order):
  //   name | category | vibe | address | description | neighborhood | lat | lng
  //
  // Only `name` is required. Leave `neighborhood` out entirely and the
  // area is worked out from the address; fill it in to override that.
  // lat and lng are optional too — fill them to pin an exact spot.
  // ============================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRV26aQBrZasOHEsVTb9YpTI-kttFYLbfSYLYFLUPziMdITXBAh6NVuQR20CGVBKuYfyayXh8RLV-Wl/pub?gid=0&single=true&output=csv";

  // Used only when SHEET_CSV_URL is empty.
  const FALLBACK_PLACES = [
    {
      name: "Live Sushi",
      category: "Restaurant",
      vibe: "",
      address: "2001 Bryant St, San Francisco, CA",
      description: "Everyone needs a neighborhood sushi spot, this has been mine for 4 years. No frill, great value, great fish, good vibes."
    }
  ];

  // ============================================================
  // 2. ABOUT TEXT
  // ============================================================
  // Edit these lines to change what the About box says. Each string
  // in `paragraphs` becomes its own paragraph.
  // ============================================================
  const ABOUT = {
    title: "About this guide",
    paragraphs: [
      "I have lived in SF proper for 8+ years, per and post pandemic. This is a running list of the places I actually go back to — reagrdless of trend or hype. Use it for your next first date or city exploration",
      "No sponsorships, no affiliate links.",
      "Last updated: July 28, 2026. This list is updated quarterly."
    ],
    // Set to "" to hide the contact line.
    contactLabel: "Send your comments",
    contactHref: "mailto:shan94ahmad@gmail.com"
  };

  // ============================================================
  // 3. CATEGORY COLORS
  // ============================================================
  // Add a line here to give a new category its own color. Any
  // category you don't list gets a color from the spare palette.
  // ============================================================
  const CATEGORY_COLORS = {
    "Bar": "#7b4b94",
    "Restaurant": "#c8553d",
    "Coffee": "#6b4423"
  };
  const SPARE_COLORS = ["#3d7a5c", "#2f6690", "#b07d2b", "#8c3b5e", "#4a5859"];

  function colorFor(category) {
    if (!CATEGORY_COLORS[category]) {
      const used = Object.keys(CATEGORY_COLORS).length - 3;
      CATEGORY_COLORS[category] = SPARE_COLORS[used % SPARE_COLORS.length];
    }
    return CATEGORY_COLORS[category];
  }

  // ============================================================
  // MAP
  // ============================================================
  const map = L.map('map', { zoomControl: true }).setView([37.7749, -122.4394], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const markers = [];

  function makeIcon(category) {
    return L.divIcon({
      className: 'custom-marker',
      html: `<div style="
        background:${colorFor(category)};
        width:22px;height:22px;
        border-radius:50%;
        border:3px solid #fff;
        box-shadow:0 2px 6px rgba(0,0,0,0.3);
      "></div>`,
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
  }

  // ============================================================
  // LOADING FROM THE SHEET
  // ============================================================
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Collects what happened during load so the sidebar can show it.
  const DIAG = { steps: [] };
  function note(label, value) {
    DIAG.steps.push({ label, value });
    console.log('[sf-guide] ' + label + ':', value);
  }

  async function loadPlaces() {
    if (!SHEET_CSV_URL) {
      document.getElementById('source-label').textContent =
        FALLBACK_PLACES.length + ' (from this file)';
      return FALLBACK_PLACES.map(normalize);
    }

    // Cache-buster so edits show up without a hard refresh.
    const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now();

    let res;
    try {
      res = await fetch(url);
    } catch (netErr) {
      note('Network error', netErr.message + ' — the request never reached Google. ' +
        'Usually this is CORS, an offline connection, or a blocked request.');
      throw netErr;
    }

    note('HTTP status', res.status + ' ' + res.statusText);
    if (!res.ok) throw new Error('Sheet returned ' + res.status);

    const csv = await res.text();
    note('Bytes received', csv.length);
    note('First line back', csv.split('\n')[0].slice(0, 200) || '(empty)');

    if (/^\s*</.test(csv)) {
      note('Problem', 'Google sent an HTML page, not CSV. The sheet is probably ' +
        'not published to the web, or the link is the address-bar link.');
      throw new Error('Got HTML instead of CSV');
    }

    const parsed = Papa.parse(csv, {
      header: true,
      skipEmptyLines: true,
      transformHeader: h => h.trim().toLowerCase()
    });

    const headers = parsed.meta.fields || [];
    note('Columns found', headers.join(', ') || '(none)');
    note('Data rows found', parsed.data.length);

    const expected = ['name', 'category', 'address', 'description'];
    const missing = expected.filter(h => !headers.includes(h));
    if (missing.length) {
      note('Missing columns', missing.join(', ') +
        ' — row 1 of the sheet must contain these exact header names.');
    }

    const all = parsed.data.map(normalize);

    // A row only needs a name to be worth showing. Without an address it
    // still appears in the list, just without a pin on the map.
    const rows = all.filter(p => p.name);

    const nameless = all.length - rows.length;
    if (nameless) {
      note('Rows skipped', nameless + ' had an empty name column');
    }

    const noLocation = rows.filter(p => !p.address && !(p.lat && p.lng));
    if (noLocation.length) {
      note('No map pin', noLocation.length + ' of them have no address: ' +
        noLocation.map(p => p.name).join(', '));
    }

    note('Usable places', rows.length);

    document.getElementById('source-label').textContent =
      rows.length + ' (from your Google Sheet)';
    return rows;
  }

  function diagnosticsHtml(headline) {
    return '<div class="notice"><strong>' + esc(headline) + '</strong>' +
      'Here is what happened, step by step:' +
      '<div class="diag">' +
      DIAG.steps.map(s =>
        '<div class="diag-row"><span class="diag-label">' + esc(s.label) + '</span>' +
        '<span class="diag-value">' + esc(s.value) + '</span></div>'
      ).join('') +
      '</div></div>';
  }

  function normalize(row) {
    const lat = parseFloat(row.lat);
    const lng = parseFloat(row.lng);
    return {
      name: (row.name || '').trim(),
      category: (row.category || 'Other').trim(),
      vibe: (row.vibe || '').trim(),
      address: (row.address || '').trim(),
      description: (row.description || '').trim(),
      // Either spelling works, and it's optional — see nbOf() below.
      neighborhood: (row.neighborhood || row.neighbourhood || '').trim(),
      autoNeighborhood: '',
      lat: isFinite(lat) ? lat : null,
      lng: isFinite(lng) ? lng : null
    };
  }

  // Where a place gets filed. Your sheet wins; otherwise we use what
  // the map lookup reported; otherwise it lands in a catch-all group.
  function nbOf(p) {
    return p.neighborhood || p.autoNeighborhood || 'Elsewhere';
  }

  // ============================================================
  // ADDRESS LOOKUP (only for rows with no lat/lng)
  // ============================================================
  const GEO_CACHE_KEY = 'sfGuideGeoCache_v3';

  // Map services name areas inconsistently; take the first that fits.
  function pickNeighborhood(a) {
    if (!a) return '';
    return (a.neighbourhood || a.quarter || a.suburb ||
            a.city_district || a.borough || '').trim();
  }

  function loadCache() {
    try { return JSON.parse(localStorage.getItem(GEO_CACHE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveCache(cache) {
    try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(cache)); }
    catch {}
  }
  function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  async function geocodeAll(places) {
    const cache = loadCache();

    const failures = [];

    for (const p of places) {
      if (p.lat && p.lng) continue;
      if (!p.address) continue;

      if (cache[p.address]) {
        p.lat = cache[p.address].lat;
        p.lng = cache[p.address].lng;
        p.autoNeighborhood = cache[p.address].nb || '';
        continue;
      }

      try {
        const url = 'https://nominatim.openstreetmap.org/search' +
          '?format=json&limit=1&addressdetails=1&q=' + encodeURIComponent(p.address);
        const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
        const data = res.ok ? await res.json() : [];

        if (data.length) {
          p.lat = parseFloat(data[0].lat);
          p.lng = parseFloat(data[0].lon);
          p.autoNeighborhood = pickNeighborhood(data[0].address);
          cache[p.address] = { lat: p.lat, lng: p.lng, nb: p.autoNeighborhood };
          saveCache(cache);
        } else {
          failures.push(p.name);
        }
      } catch (err) {
        failures.push(p.name);
        console.error('Lookup failed for', p.name, err);
      }

      // The free lookup service asks for one request per second.
      await sleep(1100);
    }

    if (failures.length) {
      note('Address not found', failures.join(', ') +
        ' — try a more specific address, or paste lat/lng into the sheet.');
    }

    return places;
  }

  // ============================================================
  // RENDERING
  // ============================================================
  function renderMarkers(places) {
    markers.forEach(m => map.removeLayer(m));
    markers.length = 0;

    places.forEach(p => {
      if (!p.lat || !p.lng) return;
      const marker = L.marker([p.lat, p.lng], { icon: makeIcon(p.category) })
        .addTo(map)
        .bindPopup(`
          <div class="popup-name">${esc(p.name)}</div>
          <div class="popup-meta">
            <span class="popup-category">${esc(p.category)}</span>
            ${p.vibe ? `<span class="vibe">${esc(p.vibe)}</span>` : ''}
          </div>
          <div class="popup-desc">${esc(p.description)}</div>
        `);
      marker.placeData = p;
      markers.push(marker);
    });

    if (markers.length) {
      const bounds = L.featureGroup(markers).getBounds();
      const bottomPad = sheetCoverPx();
      map.fitBounds(bounds, {
        paddingTopLeft: [30, 30],
        paddingBottomRight: [30, bottomPad],
        maxZoom: 15
      });
    }
  }

  function renderList(places) {
    const list = document.getElementById('list');

    if (!places.length) {
      list.innerHTML = '<div class="notice"><strong>Nothing matches</strong>' +
        'Try another category or neighborhood.</div>';
      return;
    }

    // Group by neighborhood, alphabetically, with the catch-all last.
    const groups = new Map();
    places.forEach((p, i) => {
      const key = nbOf(p);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push({ p, i });
    });

    const names = [...groups.keys()].sort((a, b) => {
      if (a === 'Elsewhere') return 1;
      if (b === 'Elsewhere') return -1;
      return a.localeCompare(b);
    });

    // With only one group there's nothing to separate, so skip headings.
    const showHeadings = names.length > 1;

    list.innerHTML = names.map(nb => {
      const rows = groups.get(nb).map(({ p, i }) => {
        const unlocated = !p.address && !(p.lat && p.lng);
        return `
      <div class="place${unlocated ? ' unlocated' : ''}" data-idx="${i}">
        <div class="place-header">
          <div class="dot" style="background:${colorFor(p.category)}"></div>
          <div class="place-name">${esc(p.name)}</div>
        </div>
        <div class="place-meta">
          <span class="place-category">${esc(p.category)}</span>
          ${p.vibe ? `<span class="vibe">${esc(p.vibe)}</span>` : ''}
        </div>
        <div class="place-desc">${esc(p.description)}</div>
        ${unlocated
          ? '<div class="no-pin">Add an address in your sheet to put this on the map</div>'
          : `<div class="place-address">${esc(p.address)}</div>`}
      </div>`;
      }).join('');

      if (!showHeadings) return rows;
      return `<div class="group-header" data-nb="${esc(nb)}">` +
        `${esc(nb)}<span class="group-count">${groups.get(nb).length}</span></div>` + rows;
    }).join('');

    // Tapping a heading frames that neighborhood on the map.
    list.querySelectorAll('.group-header').forEach(el => {
      el.addEventListener('click', () => {
        const nb = el.dataset.nb;
        const pins = markers.filter(m => nbOf(m.placeData) === nb);
        if (!pins.length) return;
        map.fitBounds(L.featureGroup(pins).getBounds(), {
          paddingTopLeft: [30, 30],
          paddingBottomRight: [30, sheetCoverPx()],
          maxZoom: 16
        });
      });
    });

    list.querySelectorAll('.place').forEach(el => {
      el.addEventListener('click', () => {
        const p = places[parseInt(el.dataset.idx, 10)];
        if (!p.lat || !p.lng) return;

        if (isPhone()) {
          // Keep the list where it is unless it's covering everything,
          // then slide the pin up into the visible strip of map.
          if (currentSnap() === 'full') setSnap('half');
          map.setView([p.lat, p.lng], 16);
          setTimeout(() => {
            const visibleH = sheet.getBoundingClientRect().top;
            const shift = Math.round((map.getSize().y - visibleH) / 2);
            if (shift > 0) map.panBy([0, shift], { animate: true });
          }, 320);
        } else {
          map.setView([p.lat, p.lng], 16);
        }

        const marker = markers.find(m => m.placeData === p);
        if (marker) setTimeout(() => marker.openPopup(), isPhone() ? 360 : 0);
      });
    });
  }

  function renderFilters(places) {
    const categories = [...new Set(places.map(p => p.category))].sort();
    const hoods = [...new Set(places.map(nbOf))].sort((a, b) => {
      if (a === 'Elsewhere') return 1;
      if (b === 'Elsewhere') return -1;
      return a.localeCompare(b);
    });

    const filters = document.getElementById('filters');
    filters.innerHTML =
      `<div class="chip active" data-filter="all">All</div>` +
      categories.map(c => `<div class="chip" data-filter="${esc(c)}">${esc(c)}</div>`).join('');

    // Restore whichever chip was active before the rebuild.
    filters.querySelectorAll('.chip').forEach(c => {
      c.classList.toggle('active', c.dataset.filter === activeFilter);
    });

    const select = document.getElementById('nb-select');
    select.innerHTML =
      `<option value="all">All neighborhoods</option>` +
      hoods.map(h => `<option value="${esc(h)}">${esc(h)}</option>`).join('');
    select.value = activeHood;
    // Only worth showing once there's more than one.
    select.parentElement.hidden = hoods.length < 2;
  }

  // ============================================================
  // FILTERING
  // ============================================================
  let ALL_PLACES = [];
  let activeFilter = 'all';
  let activeHood = 'all';

  function applyFilter() {
    const filtered = ALL_PLACES.filter(p =>
      (activeFilter === 'all' || p.category === activeFilter) &&
      (activeHood === 'all' || nbOf(p) === activeHood)
    );
    renderList(filtered);
    renderMarkers(filtered);
  }

  document.getElementById('nb-select').addEventListener('change', (e) => {
    activeHood = e.target.value;
    applyFilter();
  });

  document.getElementById('filters').addEventListener('click', (e) => {
    if (!e.target.classList.contains('chip')) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    activeFilter = e.target.dataset.filter;
    applyFilter();
  });

  // ============================================================
  // ABOUT BOX
  // ============================================================
  (function setupAbout() {
    const backdrop = document.getElementById('about-modal');
    const openBtn = document.getElementById('about-btn');
    const closeBtn = document.getElementById('about-close');

    document.getElementById('about-title').textContent = ABOUT.title;

    const body = document.getElementById('about-body');
    body.innerHTML = ABOUT.paragraphs.map(t => `<p>${esc(t)}</p>`).join('') +
      (ABOUT.contactLabel
        ? `<p><a href="${esc(ABOUT.contactHref)}">${esc(ABOUT.contactLabel)}</a></p>`
        : '');

    let lastFocus = null;

    function open() {
      lastFocus = document.activeElement;
      backdrop.hidden = false;
      closeBtn.focus();
    }
    function close() {
      backdrop.hidden = true;
      if (lastFocus) lastFocus.focus();
    }

    openBtn.addEventListener('click', open);
    closeBtn.addEventListener('click', close);

    // Clicking the dimmed area closes it; clicking the card doesn't.
    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) close();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !backdrop.hidden) close();
    });
  })();

  // ============================================================
  // PHONE BOTTOM SHEET
  // ============================================================
  // Drag the grip or the title bar to move the list up and down.
  // It settles at one of three positions: peek, half, full.
  // ============================================================
  const sheet = document.getElementById('sidebar');
  const SNAPS = ['peek', 'half', 'full'];

  // The sheet only applies to phones held upright. In landscape the
  // sidebar sits beside the map and behaves like the desktop.
  function isPhone() {
    return window.matchMedia('(max-width: 820px) and (orientation: portrait)').matches;
  }

  // How many pixels of the map the sheet is currently covering.
  function sheetCoverPx() {
    if (!isPhone()) return 40;
    const top = sheet.getBoundingClientRect().top;
    const covered = window.innerHeight - top;
    return Math.min(Math.max(covered + 16, 40), Math.round(window.innerHeight * 0.55));
  }

  function setSnap(name) {
    SNAPS.forEach(s => sheet.classList.remove(s));
    sheet.classList.add(name);
    sheet.style.removeProperty('--sheet-y');
  }

  function currentSnap() {
    return SNAPS.find(s => sheet.classList.contains(s)) || 'peek';
  }

  (function enableDrag() {
    let startY = 0, startPct = 0, dragging = false, sheetH = 0, moved = false;

    function pctForSnap(name) {
      if (name === 'full') return 0;
      if (name === 'half') return 48;
      return ((sheetH - 148) / sheetH) * 100;
    }

    function onDown(e) {
      if (!isPhone()) return;
      // Don't start a drag when the tap landed on a button in the header.
      if (e.target.closest && e.target.closest('button')) return;
      dragging = true;
      moved = false;
      sheetH = sheet.offsetHeight;
      startY = e.touches ? e.touches[0].clientY : e.clientY;
      startPct = pctForSnap(currentSnap());
      sheet.classList.add('dragging');
    }

    function onMove(e) {
      if (!dragging) return;
      const y = e.touches ? e.touches[0].clientY : e.clientY;
      if (Math.abs(y - startY) > 4) moved = true;
      const deltaPct = ((y - startY) / sheetH) * 100;
      const pct = Math.min(Math.max(startPct + deltaPct, 0), pctForSnap('peek'));
      sheet.style.setProperty('--sheet-y', pct + '%');
      if (e.cancelable) e.preventDefault();
    }

    function onUp() {
      if (!dragging) return;
      dragging = false;
      sheet.classList.remove('dragging');

      const raw = getComputedStyle(sheet).getPropertyValue('--sheet-y').trim();
      const pct = parseFloat(raw) || 0;

      // Snap to whichever position is closest.
      let best = 'peek', bestDist = Infinity;
      SNAPS.forEach(s => {
        const d = Math.abs(pct - pctForSnap(s));
        if (d < bestDist) { bestDist = d; best = s; }
      });
      setSnap(best);
    }

    ['grip', 'sheet-header'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('touchstart', onDown, { passive: true });
      el.addEventListener('mousedown', onDown);
    });
    document.addEventListener('touchmove', onMove, { passive: false });
    document.addEventListener('mousemove', onMove);
    document.addEventListener('touchend', onUp);
    document.addEventListener('mouseup', onUp);

    // Tapping the grip cycles through the positions.
    document.getElementById('grip').addEventListener('click', () => {
      if (moved) { moved = false; return; }
      const order = { peek: 'half', half: 'full', full: 'peek' };
      setSnap(order[currentSnap()]);
    });
  })();

  // iOS changes the viewport when its toolbars slide away.
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      map.invalidateSize();
      // Rotating swaps between the sheet and the side-by-side layout,
      // so the pins need refitting to the new shape.
      if (markers.length) {
        map.fitBounds(L.featureGroup(markers).getBounds(), {
          paddingTopLeft: [30, 30],
          paddingBottomRight: [30, sheetCoverPx()],
          maxZoom: 15
        });
      }
    }, 200);
  });

  // ============================================================
  // LOAD DETAILS PANEL
  // ============================================================
  document.getElementById('diag-toggle').addEventListener('click', () => {
    const panel = document.getElementById('diag-panel');
    const btn = document.getElementById('diag-toggle');
    if (panel.hidden) {
      panel.innerHTML = diagnosticsHtml('What happened on load');
      panel.hidden = false;
      btn.textContent = 'Hide load details';
    } else {
      panel.hidden = true;
      btn.textContent = 'Show load details';
    }
  });

  // ============================================================
  // START
  // ============================================================
  (async function init() {
    document.getElementById('list').innerHTML =
      '<div class="notice">Loading places…</div>';

    try {
      ALL_PLACES = await loadPlaces();

      if (!ALL_PLACES.length) {
        document.getElementById('source-label').textContent = '0 — see details';
        document.getElementById('list').innerHTML =
          diagnosticsHtml('The sheet loaded, but no places came through');
        return;
      }

      renderFilters(ALL_PLACES);
      applyFilter();              // show the list immediately
      await geocodeAll(ALL_PLACES);
      renderFilters(ALL_PLACES);  // neighborhoods are known now
      applyFilter();              // redraw once pins are placed

      const auto = ALL_PLACES.filter(p => !p.neighborhood && p.autoNeighborhood).length;
      if (auto) {
        note('Neighborhoods', auto + ' filled in automatically from the address. ' +
          'Add a neighborhood column to your sheet to override any of them.');
      }
    } catch (err) {
      console.error(err);
      document.getElementById('source-label').textContent = 'could not load';
      document.getElementById('list').innerHTML =
        diagnosticsHtml('Couldn\'t load the sheet');
    }
  })();
</script>
</body>
</html>
